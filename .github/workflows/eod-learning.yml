name: EOD Missed Opportunity Learning

on:
  schedule:
    # 10:20 UTC = 15:50 IST, after NSE cash-market close.
    - cron: '20 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eod-learning
  cancel-in-progress: false

jobs:
  eod-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scan broad NSE equity universe
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          EOD_OPPORTUNITY_TOP_N: '50'
          EOD_OPPORTUNITY_MIN_MOVE_PCT: '2.0'
          EOD_MARKETFEED_CHUNK: '100'
        run: python scripts/eod_market_opportunities.py

      - name: Reconstruct intraday setups for EOD movers
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          EOD_RECONSTRUCTION_TOP_N: '20'
          EOD_RECONSTRUCTION_INTERVAL: '5'
        run: python scripts/eod_intraday_reconstruction.py

      - name: Generate generalized missed-opportunity report
        env:
          MISSED_MOVE_THRESHOLD_PCT: '1.0'
        run: python scripts/eod_learning.py

      - name: Commit EOD research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/eod_market_opportunities.json public/data/eod_intraday_reconstruction.json public/data/eod_report.json
          if git diff --cached --quiet; then
            echo 'No EOD data changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update EOD opportunity learning report'
          git pull --rebase origin main
          git push
