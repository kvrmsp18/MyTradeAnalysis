name: MyTradeAnalysis Heartbeat Watchdog

on:
  schedule:
    # 24/7 service heartbeat. Outside market hours this is health-only; no trading occurs.
    - cron: '0 * * * *'
    # Check the paper engine throughout the NSE cash session and immediately after close.
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '*/5 10 * * 1-5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mytradeanalysis-watchdog
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check paper-cycle heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          now = datetime.now(timezone.utc)
          ist = now.astimezone(ZoneInfo('Asia/Kolkata'))
          minutes = ist.hour * 60 + ist.minute
          weekday = ist.weekday() < 5
          market_open = weekday and 9 * 60 + 15 <= minutes < 15 * 60 + 30

          url = f'https://api.github.com/repos/{repo}/actions/workflows/paper-cycle.yml/runs?per_page=10'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)
          runs = data.get('workflow_runs', [])
          scheduled = [r for r in runs if r.get('event') == 'schedule']

          if not market_open:
              print(f'HEARTBEAT OK: market closed ({ist.isoformat()}); no fresh paper cycle required.')
              sys.exit(0)

          if not scheduled:
              print('HEARTBEAT FAILURE: no scheduled paper run found during market hours.')
              sys.exit(1)

          latest = scheduled[0]
          started = latest.get('run_started_at') or latest.get('created_at')
          dt = datetime.fromisoformat(started.replace('Z', '+00:00'))
          age = (now - dt).total_seconds() / 60
          status = latest.get('status')
          conclusion = latest.get('conclusion')
          print(f"HEARTBEAT: latest_run={latest.get('run_number')} status={status} conclusion={conclusion} age_minutes={age:.1f}")

          if status in {'queued', 'in_progress'}:
              if age > 15:
                  print('HEARTBEAT FAILURE: paper cycle has been queued/running for more than 15 minutes.')
                  sys.exit(1)
              sys.exit(0)
          if conclusion != 'success':
              print('HEARTBEAT FAILURE: latest scheduled paper cycle did not succeed.')
              sys.exit(1)
          if age > 15:
              print('HEARTBEAT FAILURE: no successful paper cycle in the last 15 minutes.')
              sys.exit(1)
          print('HEARTBEAT OK: paper cycle is alive.')
          PY

      - name: Validate public AI council heartbeat
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          ist = now.astimezone(ZoneInfo('Asia/Kolkata'))
          minutes = ist.hour * 60 + ist.minute
          market_open = ist.weekday() < 5 and 9 * 60 + 15 <= minutes < 15 * 60 + 30
          url = 'https://kvrmsp18.github.io/MyTradeAnalysis/data/ai_research_council.json'
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  data = json.load(r)
          except Exception as exc:
              if market_open:
                  print(f'AI HEARTBEAT FAILURE: {exc}')
                  raise SystemExit(1)
              print(f'AI HEARTBEAT OK: market closed and public council file is not required to be fresh: {exc}')
              raise SystemExit(0)

          status = str(data.get('status', '')).upper()
          stamp = data.get('timestamp')
          age = None
          if stamp:
              try:
                  dt = datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                  age = (now - dt).total_seconds() / 60
              except ValueError:
                  pass
          print(f'AI HEARTBEAT: status={status} age_minutes={age}')

          if not market_open:
              print('AI HEARTBEAT OK: market closed.')
              raise SystemExit(0)
          if status in {'UNAVAILABLE', 'ERROR', 'INVALID', 'QUORUM_UNAVAILABLE'}:
              print('AI HEARTBEAT FAILURE: council is unavailable during market hours.')
              raise SystemExit(1)
          if age is None or age > 15:
              print('AI HEARTBEAT FAILURE: council output is stale during market hours.')
              raise SystemExit(1)
          print('AI HEARTBEAT OK: council output is fresh and structurally available.')
          PY

      - name: Publish heartbeat summary
        if: always()
        run: |
          {
            echo '## MyTradeAnalysis Heartbeat'
            echo ''
            echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo ''
            echo '- Paper-cycle watchdog: checked'
            echo '- AI council output: checked'
            echo '- Trading mode: PAPER ONLY'
            echo '- Live execution: NOT ENABLED'
          } >> "$GITHUB_STEP_SUMMARY"
