name: MyTradeAnalysis Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mytradeanalysis-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python syntax validation
        run: python -m compileall -q scripts

      - name: Run paper engine acceptance test
        run: python scripts/paper_engine_self_test.py

      - name: Validate required paper-only safeguards and AI council wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              'scripts/ai_research_council.py': [
                  'HOLD_FOR_REVIEW', 'paper_only', 'OPENAI_MODEL', 'ANTHROPIC_MODEL',
                  'cross_review', 'execution_authorized', 'DEGRADED_ONE_AI', 'AI_UNAVAILABLE', '30'
              ],
              'scripts/ai_clients.py': ['CLASSIFICATION', 'DEGRADED_ONE_AI', 'AI_UNAVAILABLE', 'Retry-After'],
              'scripts/ai_council_self_test.py': ['AI COUNCIL SELF-TEST: PASS', 'Anthropic-only', 'OpenAI-only'],
              'scripts/eod_learning.py': ['stock_specific_rules_allowed', 'automatic_strategy_mutation'],
              'scripts/eod_intraday_reconstruction.py': ['paper_only', 'automatic_strategy_mutation'],
              'scripts/eod_market_opportunities.py': ['paper_only'],
              'scripts/paper_executor.py': ['PAPER_SIMULATED_FILL', 'live_orders_enabled', 'EOD_EXIT', 'STOP_LOSS', 'OVERNIGHT_EXIT', 'MAX_POSITIONS_REACHED'],
              'scripts/market_snapshot.py': ['marketfeed/quote', 'TMPV', 'data_as_of', 'derive_regime'],
              'scripts/scrap_analysis.py': ['LIVE_MARKET_DATA_NSE', 'Yahoo Finance 5-minute fallback'],
              'scripts/eod_market_opportunities.py': ['marketfeed/quote', 'ohlc'],
              'scripts/paper_engine_self_test.py': ['PAPER ENGINE SELF-TEST: PASS', 'NO-REBUY', 'CORRUPT-STATE', 'STALE-DATA'],
              '.github/workflows/paper-trade-alerts.yml': ['Paper Market Cycle', 'BUY/SELL', 'TELEGRAM_BOT_TOKEN'],
              '.github/workflows/paper-cycle.yml': [
                  'ANTHROPIC_API_KEY', 'OPENAI_API_KEY', 'OPENAI_MODEL', 'ANTHROPIC_MODEL',
                  'claude-sonnet-5-5', 'scrap_analysis.py', 'ai_research_council.py', 'timeout-minutes: 8'
              ],
              '.github/workflows/watchdog.yml': ['PAPER ONLY', 'AI council output', 'market closed'],
              '.github/workflows/ai-development-council.yml': ['OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'ai_council_self_test.py', 'ai_development_council.py', 'fetch-depth: 0', 'Enforce GUI build success'],
              'scripts/ai_development_council.py': ['DEVELOPMENT_CLASSIFICATION', 'DEGRADED_SINGLE_AI', 'call_openai', 'call_anthropic'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'{path}: missing required safeguards/config markers: {missing}')
          print('Required paper-only, SCRAP, AI-council and heartbeat safeguards are present.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Build GUI
        run: npm run build

      - name: Final validation summary
        run: |
          echo 'VALIDATION PASSED'
          echo 'Python syntax: OK'
          echo 'AI provider fallback self-test: OK'
          echo 'Paper-only safeguards: OK'
          echo 'Technical/SCRAP wiring: OK'
          echo 'Provider-agnostic AI council wiring: OK (any available provider, deterministic fallback when none)'
          echo 'Market-aware heartbeat/watchdog: OK'
          echo 'GUI production build: OK'
          echo 'Live trading execution remains disabled.'
