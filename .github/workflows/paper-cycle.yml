name: Paper Market Cycle

on:
  push:
    paths:
      - '.github/paper-cycle.trigger'
  schedule:
    # NSE cash session: 09:15-15:30 IST = 03:45-10:00 UTC.
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-cycle
  cancel-in-progress: false

timeout-minutes: 8

jobs:
  collect-and-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Dhan access token
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python scripts/dhan_auth_check.py

      - name: Collect Dhan market snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
        run: python scripts/market_snapshot.py

      - name: Check available Dhan funds for paper-entry gating
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python scripts/paper_funds.py
      - name: Run deterministic technical SCRAP analysis
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          SCRAP_LOOKBACK_DAYS: '45'
        run: python scripts/scrap_analysis.py

      - name: Run provider-agnostic AI research council
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
        run: python scripts/ai_research_council.py

      - name: Persist decision-time observation ledger
        run: python scripts/paper_cycle.py

      - name: Run deterministic paper execution engine
        env:
          PAPER_STARTING_CAPITAL: '10000'
          PAPER_MAX_POSITION_PCT: '20'
          PAPER_TARGET_PCT: '2.0'
          PAPER_STOP_PCT: '1.0'
          PAPER_MAX_POSITIONS: '2'
        run: python scripts/paper_executor.py

      - name: Commit market snapshot, SCRAP analysis, council, ledger and paper state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data/paper/events
          git add public/data/market_snapshot.json public/data/scrap_analysis.json public/data/ai_research_council.json public/data/paper_state.json data/ledger data/paper
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m "chore: update paper market technical analysis"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
