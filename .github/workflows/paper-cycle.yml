name: Paper Market Cycle

on:
  schedule:
    # NSE cash session: 09:15-15:30 IST = 03:45-10:00 UTC.
    - cron: '45-59/5 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-cycle
  cancel-in-progress: true

jobs:
  collect-and-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Collect Dhan market snapshot
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
        run: python scripts/market_snapshot.py

      - name: Run deterministic technical SCRAP analysis
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          SCRAP_LOOKBACK_DAYS: '45'
        run: python scripts/scrap_analysis.py

      - name: Run OpenAI + Anthropic research council
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/ai_research_council.py

      - name: Persist decision-time observation ledger
        run: python scripts/paper_cycle.py

      - name: Commit market snapshot, SCRAP analysis, council and ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/market_snapshot.json public/data/scrap_analysis.json public/data/ai_research_council.json data/ledger
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m "chore: update paper market technical analysis"
          git pull --rebase origin main
          git push
