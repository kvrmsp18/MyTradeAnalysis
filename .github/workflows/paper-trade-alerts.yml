name: MyTradeAnalysis Paper Trade Alerts

on:
  workflow_run:
    workflows: ["Paper Market Cycle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest paper state
        uses: actions/checkout@v5

      - name: Send only new BUY/SELL Telegram events
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          marker='data/paper/last_notified_event.txt'
          last=$(cat "$marker" 2>/dev/null || true)
          events=$(find data/paper/events -type f -name '*.json' 2>/dev/null | sort || true)
          if [ -n "$last" ]; then events=$(printf '%s\n' "$events" | awk -v last="$last" '$0 > last'); fi
          if [ -z "$events" ]; then echo "No new paper BUY/SELL event."; exit 0; fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then echo "Telegram secrets are not configured; events remain unmarked for retry."; exit 0; fi
          sent=0
          latest_sent=''
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            side=$(jq -r '.event.side // ""' "$file")
            if [ "$side" != "BUY" ] && [ "$side" != "SELL" ]; then continue; fi
            symbol=$(jq -r '.event.symbol' "$file")
            qty=$(jq -r '.event.quantity' "$file")
            price=$(jq -r '.event.price' "$file")
            reason=$(jq -r '.event.reason // "PAPER_ENTRY"' "$file")
            pnl=$(jq -r '.event.pnl // "-"' "$file")
            ts=$(jq -r '.event.timestamp' "$file")
            if [ "$side" = "BUY" ]; then
              score=$(jq -r '.event.score // "-"' "$file")
              text="MyTradeAnalysis PAPER BUY\n\nSymbol: $symbol\nQuantity: $qty\nSimulated price: Rs.$price\nScore: $score\nTime: $ts\n\nLive trading: OFF"
            else
              text="MyTradeAnalysis PAPER SELL\n\nSymbol: $symbol\nQuantity: $qty\nSimulated price: Rs.$price\nP&L: Rs.$pnl\nReason: $reason\nTime: $ts\n\nLive trading: OFF"
            fi
            curl -fsS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$text" >/dev/null
            sent=$((sent+1)); latest_sent="$file"
          done <<< "$events"
          if [ "$sent" -gt 0 ]; then
            printf '%s\n' "$latest_sent" > "$marker"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$marker"
            git commit -m 'chore: mark Telegram paper trade alerts delivered'
            git push
          else
            echo 'No BUY/SELL events required notification.'
          fi
