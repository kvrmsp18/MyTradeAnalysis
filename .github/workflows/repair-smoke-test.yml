name: Repair Workflow Smoke Test
on:
  push:
    branches:
      - feature/strategy-reference-v1
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate restore workflow YAML
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path(".github/workflows/restore-verified-sources.yml")
          content = path.read_text(encoding="utf-8")
          try:
              parsed = yaml.safe_load(content)
          except Exception as exc:
              print(content)
              raise
          print("YAML_PARSE_OK")
          print("top_level_keys=", list(parsed))
          print("has_jobs=", "jobs" in parsed)
          print("jobs_value=", parsed.get("jobs"))
          PY
