name: Restore Source Bundle

on:
  push:
    branches:
      - feature/strategy-reference-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bundle
        uses: actions/checkout@v5
      - name: Verify bundle can be rebuilt
        shell: bash
        run: |
          set -euo pipefail
          cat repair/source_bundle.part* | base64 --decode > "$RUNNER_TEMP/sources.tar.xz"
          tar -tJf "$RUNNER_TEMP/sources.tar.xz"
