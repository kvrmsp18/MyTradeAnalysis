name: Restore Verified Patch 5 Sources

on:
  push:
    branches:
      - feature/strategy-reference-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify both source bundles and restore exact Patch 5 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch5-main" "$RUNNER_TEMP/patch5-extra"
          cat repair/source_bundle.part* | base64 --decode > "$RUNNER_TEMP/patch5-main.tar.xz"
          cat repair/patch5_extra.part* | base64 --decode > "$RUNNER_TEMP/patch5-extra.tar.xz"
          tar -xJf "$RUNNER_TEMP/patch5-main.tar.xz" -C "$RUNNER_TEMP/patch5-main"
          tar -xJf "$RUNNER_TEMP/patch5-extra.tar.xz" -C "$RUNNER_TEMP/patch5-extra"
          python - "$RUNNER_TEMP/patch5-main" "$RUNNER_TEMP/patch5-extra" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import sys

          destination = Path(sys.argv[3])
          total = 0
          for root in (Path(sys.argv[1]), Path(sys.argv[2])):
              manifest = root / "__verified__" / "SHA256SUMS.txt"
              if not manifest.is_file():
                  raise SystemExit(f"Missing SHA-256 manifest in {root}")
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  expected, relative = line.split("  ", 1)
                  source = root / relative
                  if not source.is_file():
                      raise SystemExit(f"Missing bundled source: {relative}")
                  actual = hashlib.sha256(source.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(f"SHA-256 mismatch for {relative}: {actual} != {expected}")
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  total += 1
          if total != 16:
              raise SystemExit(f"Expected 16 verified Patch 5 source files, restored {total}")
          print(f"PATCH5_SOURCE_HASHES_VERIFIED={total}")
          PY

      - name: Connect daily and hourly strategy signals without enabling orders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scrap_path = Path("scripts/scrap_analysis.py")
          source = scrap_path.read_text(encoding="utf-8")
          if "from zoneinfo import ZoneInfo" not in source:
              anchor = "from pathlib import Path\n"
              if anchor not in source:
                  raise SystemExit("SCRAP import anchor missing")
              source = source.replace(anchor, anchor + "from zoneinfo import ZoneInfo\n", 1)

          old_lookback = 'LOOKBACK_DAYS = int(os.getenv("SCRAP_LOOKBACK_DAYS", "45"))'
          new_lookback = '# 260 calendar days generally cover 125 completed sessions plus holidays.\nLOOKBACK_DAYS = int(os.getenv("SCRAP_LOOKBACK_DAYS", "260"))'
          if old_lookback in source:
              source = source.replace(old_lookback, new_lookback, 1)
          if 'LOOKBACK_DAYS = int(os.getenv("SCRAP_LOOKBACK_DAYS", "260"))' not in source:
              raise SystemExit("SCRAP 125-day history lookback could not be configured")

          old = '''                row = analyse(symbol, quote, candles)
                row["data_source"] = source
                row["candle_interval"] = interval  # indicators are computed on THESE candles
                result["stocks"].append(row)'''
          new = '''                row = analyse(symbol, quote, candles)
                try:
                    from strategy_signals import evaluate_strategy_signals

                    strategy_candles = candles
                    if interval == "1d":
                        today_ist = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Kolkata")).date()

                        def _candle_day(value):
                            try:
                                if isinstance(value, (int, float)) or str(value).isdigit():
                                    stamp = float(value)
                                    if stamp > 10_000_000_000:
                                        stamp /= 1000.0
                                    return datetime.fromtimestamp(stamp, timezone.utc).astimezone(ZoneInfo("Asia/Kolkata")).date()
                                parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                                if parsed.tzinfo is None:
                                    parsed = parsed.replace(tzinfo=timezone.utc)
                                return parsed.astimezone(ZoneInfo("Asia/Kolkata")).date()
                            except (TypeError, ValueError, OverflowError, OSError):
                                return None

                        # Only identified, completed daily candles may form the previous-125-session window.
                        strategy_candles = [
                            candle for candle in candles
                            if _candle_day(candle.get("timestamp")) is not None
                            and _candle_day(candle.get("timestamp")) < today_ist
                        ]
                    row["strategy_signals"] = evaluate_strategy_signals(
                        strategy_candles, interval, quote
                    )
                except Exception as strategy_exc:
                    row["strategy_signals"] = {
                        "version": "strategy-reference-v1",
                        "execution_authorized": False,
                        "status": "UNAVAILABLE",
                        "reason": str(strategy_exc),
                    }
                row["data_source"] = source
                row["candle_interval"] = interval  # indicators are computed on THESE candles
                result["stocks"].append(row)'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'row["strategy_signals"] = evaluate_strategy_signals(' not in source:
              raise SystemExit("SCRAP strategy insertion marker not found")
          scrap_path.write_text(source, encoding="utf-8")

          validation_path = Path(".github/workflows/validation.yml")
          validation = validation_path.read_text(encoding="utf-8")
          if "  pull_request:" not in validation:
              trigger = "on:\n  push:\n"
              if trigger not in validation:
                  raise SystemExit("Validation trigger insertion marker not found")
              validation = validation.replace(
                  trigger, "on:\n  pull_request:\n    branches: [main]\n  push:\n", 1
              )
          test_marker = "      - name: Run dynamic universe, learning-loop, per-share AI and EOD-summary self-test\\n" + "        run: python scripts/dynamic_bot_self_test.py\\n"
          step = "      - name: Run frozen strategy signal self-test\\n" + "        run: python scripts/strategy_signals_self_test.py\\n"
          if "python scripts/strategy_signals_self_test.py" not in validation:
              if test_marker not in validation:
                  raise SystemExit("Validation strategy test insertion marker not found")
              validation = validation.replace(test_marker, test_marker + step, 1)
          validation_path.write_text(validation, encoding="utf-8")
          print("STRATEGY_PIPELINE_WIRING=PASS")
          PY

      - name: Remove temporary chunks and commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git rm -r repair
          rm -f .github/workflows/restore-verified-sources.yml .github/workflows/repair-smoke-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: restore verified Patch 5 sources and wire strategy signals"
          git push origin HEAD:feature/strategy-reference-v1

      - name: Compile all Python
        run: python -m compileall -q scripts
      - name: Paper engine acceptance tests
        run: python scripts/paper_engine_self_test.py
      - name: Dhan EOD reconstruction tests
        run: python scripts/eod_intraday_reconstruction_self_test.py
      - name: AI client 429 tests
        run: python scripts/ai_clients_self_test.py
      - name: Dynamic universe and learning tests
        run: python scripts/dynamic_bot_self_test.py
      - name: Live execution safety tests
        run: python scripts/live_engine_self_test.py
      - name: Live exit safety tests
        run: python scripts/live_exit_self_test.py
      - name: Strategy signal tests
        run: python scripts/strategy_signals_self_test.py
      - name: Install frontend dependencies
        run: npm install
      - name: Build GUI
        run: npm run build
