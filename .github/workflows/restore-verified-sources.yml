name: Restore Verified Patch 5 Sources

on:
  push:
    branches:
      - feature/strategy-reference-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify both source bundles and restore exact Patch 5 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch5-main" "$RUNNER_TEMP/patch5-extra"
          cat repair/source_bundle.part* | base64 --decode > "$RUNNER_TEMP/patch5-main.tar.xz"
          cat repair/patch5_extra.part* | base64 --decode > "$RUNNER_TEMP/patch5-extra.tar.xz"
          tar -xJf "$RUNNER_TEMP/patch5-main.tar.xz" -C "$RUNNER_TEMP/patch5-main"
          tar -xJf "$RUNNER_TEMP/patch5-extra.tar.xz" -C "$RUNNER_TEMP/patch5-extra"
          python - "$RUNNER_TEMP/patch5-main" "$RUNNER_TEMP/patch5-extra" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import sys

          destination = Path(sys.argv[3])
          total = 0
          for root in (Path(sys.argv[1]), Path(sys.argv[2])):
              manifest = root / "__verified__" / "SHA256SUMS.txt"
              if not manifest.is_file():
                  raise SystemExit(f"Missing SHA-256 manifest in {root}")
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  expected, relative = line.split("  ", 1)
                  source = root / relative
                  if not source.is_file():
                      raise SystemExit(f"Missing bundled source: {relative}")
                  actual = hashlib.sha256(source.read_bytes()).hexdigest()
                  if actual != expected:
                      raise SystemExit(f"SHA-256 mismatch for {relative}: {actual} != {expected}")
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
                  total += 1
          if total != 16:
              raise SystemExit(f"Expected 16 verified Patch 5 source files, restored {total}")
          print(f"PATCH5_SOURCE_HASHES_VERIFIED={total}")
          PY

      - name: Connect daily and hourly strategy signals without enabling orders
        run: python repair/wire_strategy_signals.py

      - name: Remove temporary chunks and commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git rm -r repair
          rm -f .github/workflows/restore-verified-sources.yml .github/workflows/repair-smoke-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: restore verified Patch 5 sources and wire strategy signals"
          git push origin HEAD:feature/strategy-reference-v1

      - name: Compile all Python
        run: python -m compileall -q scripts
      - name: Paper engine acceptance tests
        run: python scripts/paper_engine_self_test.py
      - name: Dhan EOD reconstruction tests
        run: python scripts/eod_intraday_reconstruction_self_test.py
      - name: AI client 429 tests
        run: python scripts/ai_clients_self_test.py
      - name: Dynamic universe and learning tests
        run: python scripts/dynamic_bot_self_test.py
      - name: Live execution safety tests
        run: python scripts/live_engine_self_test.py
      - name: Live exit safety tests
        run: python scripts/live_exit_self_test.py
      - name: Strategy signal tests
        run: python scripts/strategy_signals_self_test.py
      - name: Install frontend dependencies
        run: npm install
      - name: Build GUI
        run: npm run build
